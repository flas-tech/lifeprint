<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LifePrint — your personalized nutrition and lifestyle book</title>
    <meta
      name="description"
      content="LifePrint turns your goals, restrictions, and lab reports into a printable, personalized nutrition and lifestyle book. Everything runs in your browser — nothing is uploaded."
    />
    <meta name="color-scheme" content="light" />
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Newsreader:opsz,wght@6..72,400;6..72,600&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/app.css" />
    <link rel="stylesheet" href="./css/themes.css" />
    <!-- Pinned CDN libraries. Both are optional: the app degrades gracefully if either fails. -->
    <script
      defer
      src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="topbar">
      <a class="brand" href="./" aria-label="LifePrint home">
        <svg width="26" height="26" viewBox="0 0 48 48" fill="none" aria-hidden="true">
          <rect x="3.5" y="3.5" width="41" height="41" rx="9" stroke="currentColor" stroke-width="2" />
          <path d="M14 34V14h6a7 7 0 0 1 0 14h-6" stroke="currentColor" stroke-width="2.4" stroke-linecap="square" />
          <path d="M26 30c3.2-1.8 5-4 5-7a7 7 0 0 0-3-5.7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity=".75" />
          <path d="M30.5 33.5c4-2.6 6.2-5.6 6.2-9.5a10.4 10.4 0 0 0-4-8.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity=".45" />
        </svg>
        <span class="brand-word">Life<em>Print</em></span>
      </a>
      <div class="topbar-spacer"></div>
      <span class="savechip desk-only" id="savechip" data-state="idle">Saved locally</span>
      <button class="btn quiet" id="btn-menu" type="button" aria-haspopup="dialog">Book &amp; data</button>
    </header>

    <div class="shell">
      <aside class="rail" id="rail" aria-label="Wizard steps"></aside>
      <main class="main" id="main" tabindex="-1"></main>
    </div>

    <div class="mobilebar" id="mobilebar" aria-hidden="false"></div>

    <div id="toasts" aria-live="polite" aria-atomic="false"></div>
    <div id="modal-root"></div>

    <noscript>
      <div style="padding: 32px; max-width: 60ch; margin: 0 auto">
        <h1>LifePrint needs JavaScript</h1>
        <p>
          The entire app — the rules engine, the book builder, and the PDF export — runs in your browser, so JavaScript
          must be enabled. Nothing you enter is ever sent to a server.
        </p>
      </div>
    </noscript>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
